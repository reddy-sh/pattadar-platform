name: Governance (Cloud Custodian)

on:
  schedule:
    - cron: "30 3 * * *" # daily 03:30 UTC = 09:00 IST
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  custodian:
    name: Report-only policy sweep (ap-south-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Install and validate BEFORE assuming the role. This job runs unattended
      # every night against the whole account, so a hijacked release of c7n or
      # anything in its dependency tree must not execute with AWS credentials
      # already in the environment. The version is exact for the same reason.
      - run: pip install --quiet 'c7n==0.9.52'
      - run: custodian validate governance/custodian/policies/*.yml

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_GOVERNANCE_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Security sweep (findings fail the job)
        run: |
          custodian run -s out/security --region ap-south-1 --dryrun governance/custodian/policies/security.yml
          python3 governance/custodian/summarize.py out/security >> "$GITHUB_STEP_SUMMARY"
          python3 governance/custodian/summarize.py --fail-on-findings out/security

      - name: Cost + tagging sweep (report only)
        if: always()
        run: |
          custodian run -s out/hygiene --region ap-south-1 --dryrun \
            governance/custodian/policies/cost.yml governance/custodian/policies/tagging.yml
          python3 governance/custodian/summarize.py out/hygiene >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: custodian-findings
          path: out/
          retention-days: 90
