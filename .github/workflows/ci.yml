name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck & build (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Agent Skills
        run: python3 scripts/validate-agent-governance.py
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test packages/core apps/web/src/api apps/web/src/lib apps/web/src/w360 apps/mobile/tests
      # Discovered, not enumerated: a list here silently stops covering the next
      # script somebody adds, which is how twelve of these came to run nowhere.
      - name: Offline rule and guard assertions
        run: |
          set -euo pipefail
          for script in scripts/*-tests.ts; do
            echo "── $script"
            bun run "$script"
          done
          bun run scripts/icon-guard.ts
          bun run scripts/ux-guards.ts
      - run: bun run build

  backend:
    name: Backend and browser regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rhub
          POSTGRES_PASSWORD: rhub-dev-pwd
          POSTGRES_DB: pattadar_ci
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U rhub -d pattadar_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_PG_DSN: host=localhost port=5432 dbname=pattadar_ci user=rhub password=rhub-dev-pwd
      TEST_PG_DSN: host=localhost port=5432 dbname=pattadar_ci user=rhub password=rhub-dev-pwd
      ALLOW_INSECURE_LOCAL: '1'
      APP_PUBLIC_URL: http://localhost:5175
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Enable isolated PostgreSQL security tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: |
          python -m venv .local/api-venv
          .local/api-venv/bin/pip install -r services/api/requirements.txt pytest
          python -m venv .local/gateway-venv
          .local/gateway-venv/bin/pip install -r services/gateway/requirements.txt pytest
          python -m venv .local/assistant-venv
          .local/assistant-venv/bin/pip install -r services/assistant/requirements.txt pytest
      - name: Initialize disposable test database
        run: .local/api-venv/bin/python scripts/init-test-db.py
      - run: .local/api-venv/bin/python -m pytest services/api/tests -q
      - run: .local/gateway-venv/bin/python -m pytest services/gateway/tests -q
      # The whole assistant suite, not a named subset: a new contract test used
      # to be able to land without ever running. Includes the attachment,
      # public-record and tool-policy contracts.
      - name: Assistant contracts
        run: .local/assistant-venv/bin/python -m pytest services/assistant/tests -q
      # Keeps prompts, provider calls, the provider secret and MCP tool
      # registration inside the boundaries declared in
      # docs/architecture/ai-inventory.yaml. Static only; calls no provider.
      - name: AI architecture boundaries
        run: |
          .local/api-venv/bin/python scripts/ai-boundary-guard.py --selftest
          .local/api-venv/bin/python scripts/ai-boundary-guard.py
      # deploy-release.py decides what reaches production ECS; it is the one
      # script whose bugs cannot be caught by a later test.
      - run: .local/api-venv/bin/python -m pytest scripts/tests -q
      - run: bunx playwright install --with-deps chromium
        working-directory: tests/e2e-web360
      - run: bun run test
        working-directory: tests/e2e-web360
      # Boundary drawing and the portfolio map are testIgnore'd by the default
      # config and own their own servers, so they need their own invocation.
      - run: bunx playwright test --config maps.config.ts
        working-directory: tests/e2e-web360
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            tests/e2e-web360/test-results
            tests/e2e-web360/playwright-report

  ios:
    name: Native rules and simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run scripts/emit-vectors.ts --check
      - name: Check web and native contracts
        env:
          PARITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$PARITY_BASE" ] && [ "$PARITY_BASE" != 0000000000000000000000000000000000000000 ]; then
            bun run scripts/parity-check.ts "$PARITY_BASE..$GITHUB_SHA"
          else
            bun run scripts/parity-check.ts "$GITHUB_SHA"
          fi
      - run: swift test
        working-directory: apps/ios/PattadarKit
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      - run: xcodebuild -project Pattadar.xcodeproj -scheme Pattadar -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/ios

  terraform-fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform

  terraform-validate:
    name: Terraform validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - envs/dev/persistent
          - envs/dev/runtime
          - envs/prod/persistent
          - envs/prod/runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform init -backend=false && terraform validate
        working-directory: infra/terraform/${{ matrix.root }}

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The JS tree is exact-pinned through bun.lock and the Python trees are
      # rebuilt on every image build, so without a scanner a known-vulnerable
      # version is neither patched nor noticed. Advisory for now: it reports
      # on every PR and nightly, and does not block a merge until the existing
      # backlog is triaged.
      - name: Scan lockfiles and manifests
        continue-on-error: true
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_1.9.2_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner --lockfile=bun.lock \
            --lockfile="requirements.txt:services/api/requirements.txt" \
            --lockfile="requirements.txt:services/gateway/requirements.txt" \
            --lockfile="requirements.txt:services/assistant/requirements.txt" \
            --format=table | tee "$GITHUB_STEP_SUMMARY"
