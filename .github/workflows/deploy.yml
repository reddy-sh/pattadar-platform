name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      IDENTITY_LEGACY_BINDINGS: ${{ vars.IDENTITY_LEGACY_BINDINGS }}
      ADMIN_SUBJECT_IDS: ${{ vars.ADMIN_SUBJECT_IDS }}
      RELEASE_PREFLIGHT_S3_URI: ${{ vars.RELEASE_PREFLIGHT_S3_URI }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Reject obsolete release
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Resolve release configuration
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform/envs/prod/runtime init -input=false
          terraform -chdir=infra/terraform/envs/prod/persistent init -input=false
          terraform -chdir=infra/terraform/envs/prod/persistent output -json ecr_repository_urls > /tmp/release-repositories.json
          {
            echo "CLUSTER=$(terraform -chdir=infra/terraform/envs/prod/runtime output -raw ecs_cluster_name)"
            echo "SPA_BUCKET=$(terraform -chdir=infra/terraform/envs/prod/runtime output -raw spa_bucket_name)"
            echo "DISTRIBUTION_ID=$(terraform -chdir=infra/terraform/envs/prod/runtime output -raw cloudfront_distribution_id)"
            echo "VITE_COGNITO_AUTHORITY=$(terraform -chdir=infra/terraform/envs/prod/persistent output -raw cognito_issuer)"
            echo "VITE_COGNITO_CLIENT_ID=$(terraform -chdir=infra/terraform/envs/prod/persistent output -raw cognito_spa_client_id)"
            echo "VITE_COGNITO_DOMAIN=$(terraform -chdir=infra/terraform/envs/prod/persistent output -raw cognito_hosted_ui_domain)"
            echo "VITE_COGNITO_REDIRECT_URI=https://pattadar.com/auth/callback"
          } >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Load reviewed migration evidence
        run: |
          test -n "$RELEASE_PREFLIGHT_S3_URI"
          aws s3 cp "$RELEASE_PREFLIGHT_S3_URI" /tmp/release-preflight.json --only-show-errors
      - run: bun run --filter @pattadar/web build
      - name: Stamp the built frontend revision
        run: printf '%s\n' "$RELEASE_SHA" > apps/web/dist/.release-sha
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build every image before changing a running service
        run: |
          set -euo pipefail
          # The browser client is the static SPA built from apps/web and synced
          # to the bucket by deploy-release.py. There is no web container: the
          # Next.js app that would have produced one was removed.
          for service in gateway api assistant; do
            repo="$(jq -r --arg service "$service" '.[$service] // empty' /tmp/release-repositories.json)"
            if [ -z "$repo" ]; then
              echo "::error::Missing ECR repository for $service"; exit 1
            fi
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin "${repo%%/*}"
            docker buildx build --platform linux/arm64 --provenance=false --tag "$repo:$RELEASE_SHA" --push "services/$service"
          done
      - name: Deploy matching backend and web revisions
        run: python3 scripts/deploy-release.py --cluster "$CLUSTER" --repositories /tmp/release-repositories.json --sha "$RELEASE_SHA" --preflight /tmp/release-preflight.json --web-origin spa --spa-bucket "$SPA_BUCKET" --distribution "$DISTRIBUTION_ID" --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: release-receipt.json
