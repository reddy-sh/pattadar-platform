name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"

permissions:
  id-token: write
  contents: read

concurrency: deploy-web

jobs:
  web:
    name: Build & deploy SPA (prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Track B guard: until the prod state backend + runtime layer exist,
      # skip gracefully instead of failing the push.
      - name: Resolve terraform outputs (or skip)
        id: tf
        run: |
          set -euo pipefail
          RUNTIME=infra/terraform/envs/prod/runtime
          PERSISTENT=infra/terraform/envs/prod/persistent
          if ! terraform -chdir="$RUNTIME" init -input=false >/dev/null 2>&1 \
            || ! spa_bucket="$(terraform -chdir="$RUNTIME" output -raw spa_bucket_name 2>/dev/null)" \
            || [ -z "$spa_bucket" ]; then
            echo "::notice::prod runtime state / SPA bucket not available (Track B not done) — skipping web deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dist_id="$(terraform -chdir="$RUNTIME" output -raw cloudfront_distribution_id)"
          terraform -chdir="$PERSISTENT" init -input=false >/dev/null
          {
            echo "skip=false"
            echo "spa_bucket=$spa_bucket"
            echo "dist_id=$dist_id"
            echo "cognito_authority=$(terraform -chdir="$PERSISTENT" output -raw cognito_issuer)"
            echo "cognito_client_id=$(terraform -chdir="$PERSISTENT" output -raw cognito_spa_client_id)"
            echo "cognito_domain=$(terraform -chdir="$PERSISTENT" output -raw cognito_hosted_ui_domain)"
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.tf.outputs.skip == 'false'
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.tf.outputs.skip == 'false'
        run: bun install --frozen-lockfile

      - name: Build web
        if: steps.tf.outputs.skip == 'false'
        env:
          VITE_COGNITO_AUTHORITY: ${{ steps.tf.outputs.cognito_authority }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client_id }}
          VITE_COGNITO_DOMAIN: ${{ steps.tf.outputs.cognito_domain }}
          VITE_COGNITO_REDIRECT_URI: https://pattadar.com/auth/callback
        run: bun run --filter @pattadar/web build

      - name: Sync SPA to S3
        if: steps.tf.outputs.skip == 'false'
        run: aws s3 sync apps/web/dist "s3://${{ steps.tf.outputs.spa_bucket }}" --delete

      - name: Invalidate CloudFront
        if: steps.tf.outputs.skip == 'false'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.dist_id }}" \
            --paths "/index.html" "/*"

  # TODO(Phase 1): service image builds — one job per service (gateway, api,
