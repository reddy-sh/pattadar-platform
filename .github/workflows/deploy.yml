  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       service: [gateway, api]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: aws-actions/configure-aws-credentials@v4
  #       with:
  #         role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  #         aws-region: ap-south-1
