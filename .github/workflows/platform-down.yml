name: Platform down

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to bring down (runtime layer only)
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod
      confirm:
        description: "For prod, type exactly: decommission-prod"
        type: string
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency: platform-${{ inputs.environment }}

jobs:
  down:
    name: platform-down (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Guard prod with typed confirmation
        if: ${{ inputs.environment == 'prod' && inputs.confirm != 'decommission-prod' }}
        run: |
          echo "::error::Refusing to bring down prod — set the confirm input to 'decommission-prod'."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Bring platform down
        env:
          PLATFORM_DOWN_CONFIRM: "yes"
        run: ./scripts/platform-down.sh "${{ inputs.environment }}"
