version: 2

# The workflows pin actions by commit SHA, which is the whole point but also
# means nothing ever updates them again. Dependabot is what turns a pin from
# "frozen" into "reviewed": it opens a PR with the new SHA and the release
# notes, and CI decides.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development

  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /services/gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /services/assistant
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /services/api
      - /services/gateway
      - /services/assistant
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
