# XcodeGen spec — `brew install xcodegen && xcodegen generate` in apps/ios.
#
# The project file is generated rather than committed so it cannot drift from
# the sources, and so a merge never has to resolve a pbxproj.
name: Pattadar
options:
  bundleIdPrefix: com.pattadar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PattadarKit:
    path: PattadarKit
# The Run scheme carries the dev identity and server, so ⌘R in Xcode shows
# YOUR records without anyone editing scheme settings by hand. Both are read
# from the environment at launch, so a device build can override them.
schemes:
  Pattadar:
    build:
      targets:
        Pattadar: all
    run:
      config: Debug
      environmentVariables:
        PATTADAR_USER: sankara.telukutla
        # Local API for development runs from Xcode; the installed app
        # defaults to production (see the bundle plist below).
        PATTADAR_API_URL: http://127.0.0.1:8080
  # The screenshot tour — the only pair of eyes on a Mac whose simulators
  # run headless. `xcodebuild test -scheme PattadarUITour`, then export the
  # attachments from the result bundle.
  PattadarUITour:
    build:
      targets:
        Pattadar: all
        PattadarUITests: [test]
    test:
      config: Debug
      targets:
        - PattadarUITests
targets:
  PattadarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PattadarUITests
    dependencies:
      - target: Pattadar
    settings:
      base:
        DEVELOPMENT_TEAM: WME7N6KM67
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: Pattadar
        GENERATE_INFOPLIST_FILE: YES
  Pattadar:
    type: application
    platform: iOS
    sources:
      - Pattadar/Sources
      # The icon: the Rye P, white on brick red — the wordmark's own mark.
      - Pattadar/Assets.xcassets
      # Compiled into the app AND the widget extension. `FileAPaperIntent` runs
      # in whichever process the system picks, so it has to exist in both.
      - Shared
    # Same team as the React Native app, so a device build signs without any
    # manual step in Xcode. Automatic signing lets Xcode manage the profile.
    settings:
      base:
        DEVELOPMENT_TEAM: WME7N6KM67
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The brand amber, light and dark, from design.md. Without this the
        # asset is compiled but never consulted, and every `Color.accentColor`
        # in the app — twenty-eight of them — falls back to stock iOS blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # A device build reaches the Mac over the tunnel, not localhost — the
        # simulator shares the Mac's network stack, a phone does not.
        # An id your team ALREADY has a provisioning profile for, so a device
        # build signs with no Apple-account round trip. com.pattadar.app belongs
        # to the React Native app; both must coexist on the phone.
        PRODUCT_BUNDLE_IDENTIFIER: com.rfactory.pattadar
        # The App Group is the ONLY ground the app and its widgets share. A
        # widget extension cannot read the app's Documents directory and has no
        # credentials of its own, so without this the snapshot is written into
        # a container nothing else can see and every widget stays blank.
        CODE_SIGN_ENTITLEMENTS: Pattadar/Pattadar.entitlements
    dependencies:
      - package: PattadarKit
      # The widgets ship with the app. Both this and the extension's own
      # entitlements need a provisioning profile that carries the App Group;
      # automatic signing creates one, which needs an Apple ID signed into
      # Xcode (Settings → Accounts). A device build fails on signing without it
      # while the simulator stays green, so check the DEVICE build after
      # touching either.
      - target: PattadarWidgetExtension
        embed: true
    info:
      path: Pattadar/Info.plist
      properties:
        # Plain "Pattadar" now — this IS the app. The React Native build,
        # where still installed, is the one that must give way; two identical
        # names on one phone means deleting the RN app, not renaming this one.
        CFBundleDisplayName: Pattadar
        UILaunchScreen: {}
        # Local development talks to the Mac over http; remove with the tunnel.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: Pattadar uses your location only to help you place a pin on your land.
        NSCameraUsageDescription: Pattadar uses the camera to photograph deeds and land.
        NSPhotoLibraryUsageDescription: Pattadar reads deeds and passbooks from photos you choose.
        # Cognito's sign-in callback (pattadar://auth on the pattadar-mobile
        # app client). ASWebAuthenticationSession catches it itself, but the
        # scheme is registered so the OS knows it is ours.
        CFBundleURLTypes:
          - CFBundleURLName: com.rfactory.pattadar.auth
            CFBundleURLSchemes: [pattadar]
        # Baked into the BUNDLE, not the scheme.
        #
        # Scheme environment variables only reach the app when Xcode launches
        # it. Tapping the icon, or installing with devicectl, gets none of
        # them — these are the defaults; the env vars still override for
        # development.
        #
        # PRODUCTION, through the gateway. The tunnel to the founder's laptop
        # is retired: a laptop is a part-time server, and the app died every
        # time the lid closed. api.<domain> goes to the ALB directly rather
        # than through CloudFront, because a deed read runs ~90 seconds and
        # CloudFront caps origin reads at 60 — the ALB and the gateway both
        # allow 200. Identity is the Cognito token; the gateway strips the
        # header below and every other identity claim a client makes.
        PattadarAPIURL: https://api.pattadar.com/api/gateway/pattadar
        PattadarUser: sankara.telukutla

  PattadarWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - PattadarWidget
      # The intent, compiled into both binaries — see the app target above.
      - Shared
      # The design system itself, NOT a copy of its values. A widget that
      # invented its own greens and radii would be recognisably a different
      # app sitting next to the one it belongs to. The file imports nothing but
      # PattadarKit and SwiftUI, so it compiles here unchanged.
      - path: Pattadar/Sources/DesignSystem.swift
        group: Pattadar/Sources
    dependencies:
      - package: PattadarKit
    settings:
      base:
        DEVELOPMENT_TEAM: WME7N6KM67
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.rfactory.pattadar.widget
        CODE_SIGN_ENTITLEMENTS: PattadarWidget/PattadarWidget.entitlements
    info:
      path: PattadarWidget/Info.plist
      properties:
        # "Pattadar" rather than "Your land": this name labels the whole group
        # in the widget gallery, and it now holds three widgets and a control.
        # Each says what it is on its own card.
        CFBundleDisplayName: Pattadar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
